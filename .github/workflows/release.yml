name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

env:
  GRADLE_OPTS: -Dorg.gradle.console=plain
  ANNOTATE: python3 -I .github/scripts/annotate-gradle-errors.py
  # Optional repository variable; empty/unset falls back to the default in app/build.gradle.kts.
  WEB_CLIENT_ID: ${{ vars.WEB_CLIENT_ID }}

jobs:
  release:
    name: Build & publish signed release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          cache-read-only: true

      - name: Derive version from tag
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # v1.2.3 -> name 1.2.3, code 1*1000000 + 2*1000 + 3 (pre-release suffixes are kept in the name only).
          name="${TAG#v}"
          if [[ ! "$name" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)([-+].*)?$ ]]; then
            echo "::error title=Release tag::Tag '$TAG' is not vMAJOR.MINOR.PATCH"
            exit 1
          fi
          code=$(( BASH_REMATCH[1] * 1000000 + BASH_REMATCH[2] * 1000 + BASH_REMATCH[3] ))
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error title=Signing::KEYSTORE_BASE64 secret is not set"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"

      - name: Build signed release APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          set -o pipefail
          mkdir -p ci-logs
          ./gradlew assembleRelease -PversionName="$VERSION_NAME" -PversionCode="$VERSION_CODE" \
            ${WEB_CLIENT_ID:+"-Psignalbackup.webClientId=$WEB_CLIENT_ID"} \
            2>&1 | tee ci-logs/assembleRelease.log \
            || { $ANNOTATE ci-logs/assembleRelease.log "assembleRelease"; exit 1; }

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"

      - name: Verify signature and write checksums
        id: apk
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          set -euo pipefail
          src=$(ls app/build/outputs/apk/release/*.apk | grep -v unsigned | head -n1)
          apk="SignalBackup-${VERSION_NAME}.apk"
          cp "$src" "$apk"
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)/apksigner
          certs=$("$apksigner" verify --verbose --print-certs "$apk")
          echo "$certs"
          {
            echo "### Release APK signing certificate"
            echo
            echo "Register this SHA-1 as an Android OAuth client (package \`com.johnsonyuen.signalbackup\`) in the Cloud project of the Web client ID, or Google sign-in fails. APKs installed from Google Play are re-signed with the Play App Signing key, which needs its own client."
            echo
            echo "Web client ID: \`${WEB_CLIENT_ID:-default from app/build.gradle.kts}\`"
            echo
            echo '```'
            echo "$certs" | grep -E 'SHA-1|SHA-256|DN:' || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          sha256sum "$apk" > SHA256SUMS.txt
          cat SHA256SUMS.txt
          echo "path=$apk" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.apk.outputs.path }}

      - name: Create GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            ${{ steps.apk.outputs.path }}
            SHA256SUMS.txt

      - name: Upload Gradle logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-gradle-logs
          path: ci-logs/
          if-no-files-found: ignore
          retention-days: 7
