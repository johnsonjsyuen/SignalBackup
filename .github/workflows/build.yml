name: CI Build

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 20
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 20

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          set -o pipefail
          ./gradlew assembleDebug -Dorg.gradle.java.home=$JAVA_HOME 2>&1 | tee build.log

      - name: Annotate build errors
        if: failure()
        run: |
          grep -E '^e: |error:|What went wrong|Could not|> ' build.log | head -60 | while IFS= read -r line; do echo "::error::${line}"; done

      - name: Run lint
        run: ./gradlew lint -Dorg.gradle.java.home=$JAVA_HOME

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
