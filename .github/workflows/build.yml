name: CI Build

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

env:
  GRADLE_OPTS: -Dorg.gradle.console=plain
  ANNOTATE: python3 -I .github/scripts/annotate-gradle-errors.py

jobs:
  build:
    name: Build, test & lint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Build debug APK
        id: assemble
        run: |
          set -o pipefail
          mkdir -p ci-logs
          ./gradlew assembleDebug 2>&1 | tee ci-logs/assembleDebug.log \
            || { $ANNOTATE ci-logs/assembleDebug.log "assembleDebug"; exit 1; }

      - name: Unit tests
        if: ${{ !cancelled() && steps.assemble.outcome == 'success' }}
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest 2>&1 | tee ci-logs/testDebugUnitTest.log \
            || { $ANNOTATE ci-logs/testDebugUnitTest.log "testDebugUnitTest"; exit 1; }

      - name: Lint
        if: ${{ !cancelled() && steps.assemble.outcome == 'success' }}
        run: |
          set -o pipefail
          ./gradlew lintDebug 2>&1 | tee ci-logs/lintDebug.log \
            || { $ANNOTATE ci-logs/lintDebug.log "lintDebug"; exit 1; }

      - name: Build release APK (unsigned)
        if: ${{ !cancelled() && steps.assemble.outcome == 'success' }}
        run: |
          set -o pipefail
          ./gradlew assembleRelease 2>&1 | tee ci-logs/assembleRelease.log \
            || { $ANNOTATE ci-logs/assembleRelease.log "assembleRelease"; exit 1; }

      - name: Upload debug APK
        if: ${{ !cancelled() && steps.assemble.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lint-reports
          path: app/build/reports/lint-results-*
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Room schemas
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: room-schemas
          path: app/schemas/
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload Gradle logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gradle-logs
          path: ci-logs/
          if-no-files-found: ignore
          retention-days: 7
