name: CI Build

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

env:
  GRADLE_OPTS: -Dorg.gradle.console=plain
  ANNOTATE: python3 -I .github/scripts/annotate-gradle-errors.py

jobs:
  build:
    name: Build, test & lint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Failing tests (diagnostic)
        run: |
          ./gradlew testDebugUnitTest --tests '*UploadSchedulerImplTest' --tests '*HomeViewModelTest' --tests '*SettingsViewModelTest' || true
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          for f in glob.glob('app/build/test-results/testDebugUnitTest/*.xml'):
              for tc in ET.parse(f).getroot().iter('testcase'):
                  for fail in list(tc.findall('failure')) + list(tc.findall('error')):
                      lines = [l for l in (fail.text or '').splitlines() if l.strip()]
                      keep = [l for l in lines if not l.strip().startswith('at ') or 'signalbackup' in l or 'androidx.work' in l][:30]
                      msg = (tc.get('classname').split('.')[-1] + ' > ' + tc.get('name') + '\n' + '\n'.join(keep)).replace('%','%25').replace('\n','%0A')
                      print('::error title=trace::' + msg)
          PY
