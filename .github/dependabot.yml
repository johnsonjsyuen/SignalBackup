version: 2
updates:
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
    groups:
      kotlin-toolchain:
        patterns:
          - "org.jetbrains.kotlin*"
          - "com.google.devtools.ksp*"
      androidx:
        patterns:
          - "androidx.*"
      test:
        patterns:
          - "junit*"
          - "io.mockk*"
          - "org.robolectric*"
          - "app.cash.turbine*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
